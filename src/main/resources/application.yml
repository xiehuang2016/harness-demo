server:
  port: 8080
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:harness;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
# Enable only in local development; never expose the console in production.
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
